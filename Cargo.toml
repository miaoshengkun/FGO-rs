[package]
name = "fgo-rs"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
description = "Cross-platform FGO automation core with Rhai strategies"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
rhai = { version = "1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
