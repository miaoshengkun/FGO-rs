[package]
name = "fgo-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "AGPL-3.0-only"
description = "Cross-platform FGO automation core with Rhai strategies"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
image = { version = "0.25", default-features = false, features = ["png"] }
rhai = { version = "1", features = ["internals", "sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
ureq = { version = "3", default-features = false, features = ["gzip", "rustls"] }

[dev-dependencies]
tempfile = "3"

[profile.dev]
opt-level = 1

[profile.test]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
